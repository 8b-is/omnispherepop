name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build (dry run does not publish)
        required: false

permissions:
  contents: read

jobs:
  # Unsigned binaries only. Release signing uses 2-of-3 key custody and is not
  # configured in this repository yet; see docs/STATUS.md.
  binary:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release -p ospop-cli -p ospop-mcp --target ${{ matrix.target }}
      - name: smoke test (host only)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/ospop quantize || \
          ./target/${{ matrix.target }}/release/ospop.exe quantize
      - name: package
        run: bash scripts/package-target.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: omnispherepop-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  # One macOS job builds both arches and lipo-merges them. Two separate macOS
  # matrix jobs kept getting cancelled for runner capacity, and a universal
  # binary is what the docs promise anyway.
  apple:
    name: aarch64+x86_64-apple-darwin (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: build both arches
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p ospop-cli -p ospop-mcp --target aarch64-apple-darwin
          cargo build --release -p ospop-cli -p ospop-mcp --target x86_64-apple-darwin
      - name: lipo
        run: |
          mkdir -p dist/universal
          lipo -create -output dist/universal/ospop \
            target/aarch64-apple-darwin/release/ospop \
            target/x86_64-apple-darwin/release/ospop
          lipo -create -output dist/universal/ospop-mcp \
            target/aarch64-apple-darwin/release/ospop-mcp \
            target/x86_64-apple-darwin/release/ospop-mcp
          file dist/universal/ospop
          dist/universal/ospop --version
      - name: package
        run: |
          mkdir -p dist/universal/omnispherepop
          cp dist/universal/ospop dist/universal/ospop-mcp README.md LICENSE-MIT LICENSE-APACHE dist/universal/omnispherepop/
          tar -czf dist/universal/omnispherepop-aarch64+x86_64-apple-darwin.tar.gz -C dist/universal omnispherepop
      - uses: actions/upload-artifact@v4
        with:
          name: omnispherepop-aarch64+x86_64-apple-darwin
          path: dist/universal/*.tar.gz
          if-no-files-found: error