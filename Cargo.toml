[workspace]
members = ["crates/omnispherepop-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Peter Lodri Sec"]
repository = "https://github.com/peterlodri-sec/omnispherepop"

[workspace.dependencies]
sha2 = "0.10"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
