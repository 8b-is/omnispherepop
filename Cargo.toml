[workspace]
members = ["crates/ospop-core", "crates/ospop-academy", "crates/ospop-runtime", "crates/ospop-cli", "crates/ospop-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Peter Lodri Sec", "88B (8b-is)", "Standard Galactic"]
repository = "https://github.com/omnispherepop/omnispherepop"
rust-version = "1.78"

[workspace.dependencies]
ospop-core = { path = "crates/ospop-core" }
ospop-academy = { path = "crates/ospop-academy" }
ospop-runtime = { path = "crates/ospop-runtime" }
sha2 = "0.10"
serde_json = "1"
clap = { version = "4", features = ["derive"] }